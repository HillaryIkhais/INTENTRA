name: near

on:
  push:
    branches: [main]
    paths:
      - "near/**"
      - ".github/workflows/near.yml"
  pull_request:
    paths:
      - "near/**"
      - ".github/workflows/near.yml"

jobs:
  contract:
    name: contract tests + wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: near
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: near

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Tests (41)
        run: cargo test -p intentra-near

      - name: WASM release build
        run: cargo build -p intentra-near --target wasm32-unknown-unknown --release

      - name: WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: intentra-near-wasm
          path: near/target/wasm32-unknown-unknown/release/intentra_near.wasm
          if-no-files-found: error

  sdk:
    name: sdk build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: near
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: near/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build SDK
        run: npm run build

      - name: Syntax-check scripts
        run: |
          for file in scripts/*.js; do node --check "$file"; done
