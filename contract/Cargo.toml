[package]
name = "intentra-vault"
version = "1.0.0"
edition = "2021"
description = "INTENTRA — contract-enforced non-escalating agent delegation on NEAR"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
serde_json = "1"

[dev-dependencies]
near-workspaces = "0.24"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
# Enables near-sdk to compile natively during tests (feature unification).
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# NOTE: panic = "abort" would erase panic messages (guest sees `unreachable`
# trap). Contract rejection messages are part of the evidence surface.

